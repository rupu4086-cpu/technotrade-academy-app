# TechnoTrade Academy — build the Android debug APK on GitHub Actions.
#
# Why this workflow does extra generation steps:
# - The launcher PNGs (assets/icon.png and the mipmap ic_launcher*.png
#   files) are binary and were not committed via the text-only snapshot
#   push, so they are regenerated here from the same "Market Amber"
#   design (charcoal rounded square, amber candlesticks, TECHNOTRADE).
# - android/gradle/wrapper/gradle-wrapper.jar is also binary and was
#   not committed, so a system Gradle (8.10.2, matching the wrapper
#   properties) is used instead of ./gradlew.
# - android/app/debug.keystore is not committed; a standard Android
#   debug keystore is generated here (storepass/keypass "android",
#   alias "androiddebugkey") — debug builds only, never for release.
# - No secrets are in this repo: src/config.ts holds empty placeholders
#   for the Supabase anon key and Razorpay Key ID. Never commit a
#   Supabase service-role key, Razorpay secret, Firebase server key,
#   or google-services.json.
# - google-services.json is NOT in the repo. For FCM to work in the
#   built APK, the owner must add a GitHub Actions secret named
#   GOOGLE_SERVICES_JSON containing the base64 of google-services.json
#   (Firebase project technotrade-36811, package
#   academy.technotrade.app). The workflow below writes it to
#   android/app/google-services.json before building. If the secret
#   is missing, the build still succeeds but FCM stays off (shim).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.10.2"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Regenerate launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          def make_icon(size):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              d.rounded_rectangle([0, 0, size - 1, size - 1], radius=int(size * 0.18), fill=(30, 27, 22, 255))
              w = size / 512.0
              candles = [
                  (0.28, 0.34, 0.58, 0.24, 0.68, (232, 160, 32, 255)),
                  (0.50, 0.24, 0.48, 0.16, 0.58, (232, 160, 32, 255)),
                  (0.72, 0.44, 0.62, 0.34, 0.74, (232, 160, 32, 255)),
              ]
              for cx, bt, bb, wt, wb, col in candles:
                  x = int(cx * size)
                  bw = max(2, int(0.09 * size))
                  d.line([(x, int(wt * size)), (x, int(wb * size))], fill=col, width=max(1, int(0.015 * size)))
                  d.rectangle([x - bw // 2, int(bt * size), x + bw // 2, int(bb * size)], fill=col)
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", int(size * 0.085))
              except Exception:
                  font = ImageFont.load_default()
              text = "TECHNOTRADE"
              tb = d.textbbox((0, 0), text, font=font)
              d.text(((size - (tb[2] - tb[0])) / 2, size * 0.82), text, font=font, fill=(250, 246, 239, 255))
              return img

          targets = {
              "assets/icon.png": 512,
              "android/app/src/main/res/mipmap-mdpi/ic_launcher.png": 48,
              "android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png": 48,
              "android/app/src/main/res/mipmap-hdpi/ic_launcher.png": 72,
              "android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png": 72,
              "android/app/src/main/res/mipmap-xhdpi/ic_launcher.png": 96,
              "android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png": 96,
              "android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png": 144,
              "android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png": 144,
              "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png": 192,
              "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png": 192,
          }
          for path, size in targets.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              make_icon(size).save(path)
              print("generated", path, size)
          PY

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -keystore android/app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Restore google-services.json from secret (optional, for FCM)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "google-services.json restored from secret."
          else
            echo "GOOGLE_SERVICES_JSON secret not set - building without FCM (notifications off)."
          fi

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
